[project]
name = "ghcompute"
version = "0.1.0"
description = "GPU-accelerated point-cloud primitives, the compute layer of the GHCompute Grasshopper plugin."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Graham Livingston" }]
dependencies = [
  "torch>=2.5",
  "numpy",
  "plyfile",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghcompute"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
